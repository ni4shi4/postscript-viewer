name: Test

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval:
    runs-on: ubuntu-latest
    environment: test-approval
    steps:
      - run: echo approved

  small:
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: asdf-vm/actions/install@v4
      - run: npm ci
      - run: npm run test:small

  lint:
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: asdf-vm/actions/install@v4
      - run: npm ci
      - run: npm run lint

  medium:
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: asdf-vm/actions/install@v4
      - run: npm ci
      - run: npm run test:medium

  large:
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: asdf-vm/actions/install@v4
      - run: npm ci
      - id: gs-wasm
        uses: actions/cache@v6
        with:
          path: |
            public/gs.wasm
            src/generated/ghostscript/gs.mjs
          key: gs-wasm-${{ hashFiles('docker/ghostscript-wasm/**', 'scripts/build-gs-wasm.mjs', 'scripts/gs-wasm-assets.mjs', 'gs-wasm.sha256') }}
      - if: steps.gs-wasm.outputs.cache-hit != 'true'
        run: npm run build:wasm
      - run: npx playwright install --with-deps chromium
      - run: npm run test:large
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
