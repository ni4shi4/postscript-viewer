<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PostScript（.ps / .ps.gz）をブラウザ内で PDF に変換して表示するビューア。ファイルは外部に送信されません。"
    />
    <title>PostScript ビューア - .ps / .ps.gz をブラウザで PDF 表示</title>
  </head>
  <body>
    <header class="toolbar">
      <div id="mount-toolbar-intro"></div>
      <label class="file-picker">
        <span class="file-picker__label">PostScript ファイル</span>
        <input
          type="file"
          accept=".ps,.gz"
          data-testid="file-input"
          aria-describedby="file-limits-notice privacy-notice trust-notice"
        />
        <div id="mount-file-limits-notice"></div>
      </label>
      <p class="viewer-file-name" data-viewer-file-name data-testid="viewer-file-name" hidden></p>
      <div id="mount-privacy-notice"></div>
      <div id="mount-trust-notice"></div>
      <p
        class="viewer-status"
        data-viewer-status
        data-testid="viewer-status"
        role="status"
        aria-live="polite"
        hidden
      ></p>
    </header>
    <main class="viewer">
      <iframe title="変換された PDF" data-testid="pdf-frame" hidden></iframe>
      <div class="pdf-canvas-container" data-testid="pdf-canvas-container" hidden></div>
    </main>
    <footer class="app-footer" id="mount-app-footer"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
