<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PostScript（.ps / .ps.gz）をブラウザ内で PDF に変換して表示するビューア。ファイルは外部に送信されません。"
    />
    <title>PostScript ビューア - .ps / .ps.gz をブラウザで PDF 表示</title>
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-intro">
        <h1>PostScript ビューア</h1>
        <p class="toolbar-intro__description">
          ブラウザ内で PostScript を PDF に変換して表示します。
        </p>
        <h2>使い方</h2>
        <ol class="toolbar-intro__steps">
          <li>PostScript ファイルを選ぶ</li>
          <li>変換が終わるまで待つ</li>
          <li>表示された PDF を確認する</li>
        </ol>
      </div>
      <label class="file-picker">
        <span class="file-picker__label">PostScript ファイル</span>
        <input
          type="file"
          accept=".ps,.gz"
          data-testid="file-input"
          aria-describedby="privacy-notice trust-notice"
        />
      </label>
      <p class="viewer-file-name" data-viewer-file-name data-testid="viewer-file-name" hidden></p>
      <p id="privacy-notice" class="privacy-notice">
        ファイルはサーバーへ送信されず、すべてお使いの端末上で処理されます。
      </p>
      <p class="trust-notice" id="trust-notice" data-testid="trust-notice">
        信頼できる PostScript ファイルだけを開いてください。
      </p>
      <p
        class="viewer-status"
        data-viewer-status
        data-testid="viewer-status"
        role="status"
        aria-live="polite"
        hidden
      ></p>
    </header>
    <main class="viewer">
      <iframe title="変換された PDF" data-testid="pdf-frame" hidden></iframe>
      <div class="pdf-canvas-container" data-testid="pdf-canvas-container" hidden></div>
    </main>
    <footer class="app-footer">
      <a href="https://github.com/ni4shi4/postscript-viewer" rel="noopener noreferrer"
        >ソースコード</a
      >
      <span class="app-footer__sep" aria-hidden="true">·</span>
      <span>AGPL-3.0</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
