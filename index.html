<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>postscript-viewer</title>
  </head>
  <body>
    <header class="toolbar">
      <label class="file-picker">
        <span>PostScript ファイル（.ps / .ps.gz）</span>
        <input type="file" accept=".ps,.gz" />
      </label>
      <p class="viewer-status" data-viewer-status role="status" aria-live="polite" hidden></p>
    </header>
    <main class="viewer">
      <iframe title="変換された PDF" hidden></iframe>
    </main>
    <footer class="app-footer">
      <a href="https://github.com/ni4shi4/postscript-viewer" rel="noopener noreferrer"
        >ソースコード</a
      >
      <span class="app-footer__sep" aria-hidden="true">·</span>
      <span>AGPL-3.0</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
